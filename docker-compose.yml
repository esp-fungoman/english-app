services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - english_pg:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - english_redis:/data
    networks:
      - redis_private
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  redis_private:
    internal: true

volumes:
  english_redis:
  english_pg:
